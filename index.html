<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALL STAR CLAN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #080808; color: #ffffff; font-family: 'Orbitron', sans-serif; 
            margin: 0; padding: 20px; display: flex; justify-content: center;
            min-height: 100vh; box-sizing: border-box; overflow-x: hidden;
        }
        
        .app-container { width: 100%; max-width: 450px; }

        header { text-align: center; margin-bottom: 25px; }
        .neon-text { color: #ff0000; font-size: 2.2rem; text-shadow: 0 0 15px #ff0000; margin: 0; transition: 0.8s; }
        .sub-title { color: #444; letter-spacing: 3px; font-size: 0.7rem; margin-top: 5px; }

        .screen { display: none; opacity: 0; transform: translateY(10px); transition: 0.4s ease; }
        .screen.active { display: block; opacity: 1; transform: translateY(0); }

        .card { 
            background: #111; border: 1px solid #222; border-radius: 15px; 
            padding: 20px; margin-bottom: 12px; cursor: pointer; text-align: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:active { transform: scale(0.95); }
        
        .card-vip { border: 1px solid #ffd700; position: relative; overflow: hidden; }
        .card-vip h2 { color: #ffd700; margin: 0; transition: 0.5s; }
        .vip-subtext { color: #886d00; font-size: 0.7rem; transition: 0.5s; }

        /* Анимация вспышки */
        .auth-flash { animation: flashAnim 0.8s ease-out forwards; }
        @keyframes flashAnim {
            0% { background: #ffd700; }
            50% { background: #fff; box-shadow: 0 0 50px #fff; }
            100% { background: #111; }
        }

        input { 
            background: #151515; border: 1px solid #333; padding: 15px; color: #fff; 
            border-radius: 10px; font-family: 'Orbitron'; width: 100%; box-sizing: border-box; 
            margin-bottom: 10px; text-align: center; outline: none;
        }

        .action-btn { 
            background: #ff0000; color: #fff; border: none; padding: 16px; 
            border-radius: 10px; width: 100%; font-family: 'Orbitron'; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
        }

        .loader { display: none; margin: 25px auto; width: 30px; height: 30px; border: 3px solid rgba(255, 0, 0, 0.2); border-radius: 50%; border-top-color: #ff0000; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .back-nav { color: #ff0000; font-size: 0.8rem; cursor: pointer; margin-bottom: 15px; display: inline-block; }
        .hidden { display: none !important; }
        
        /* Скрываем контент VIP до конца анимации */
        #vip-members { opacity: 0; transition: opacity 0.5s ease; }
        #vip-members.show-content { opacity: 1; }

        .status-box { border: 1px solid #ffd700; color: #ffd700; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <header id="main-header">
            <h1 class="neon-text">ALL STAR</h1>
            <p class="sub-title">CLAN MANAGEMENT</p>
        </header>

        <div id="ui-back" class="back-nav hidden" onclick="showScreen('main-menu')">← НАЗАД</div>

        <div id="main-menu" class="screen active">
            <div class="card" onclick="showScreen('blacklist-screen')">
                <div style="font-size: 24px;">🚫</div>
                <h2>ЧЕРНЫЙ СПИСОК</h2>
                <p style="color: #555; font-size: 0.7rem;">ПРОВЕРКА ИГРОКА</p>
            </div>
            
            <div id="vip-card-main" class="card card-vip" onclick="showScreen('vip-screen')">
                <div style="font-size: 24px;">👑</div>
                <h2 id="vip-label">VIP</h2>
                <p id="vip-sub" class="vip-subtext">ДЛЯ КЛАНА</p>
            </div>

            <div class="card" onclick="openContact()">
                <div style="font-size: 24px;">📝</div>
                <h2>ВСТУПИТЬ</h2>
                <p style="color: #555; font-size: 0.7rem;">ЛИДЕРУ В ЛС</p>
            </div>
        </div>

        <div id="blacklist-screen" class="screen">
            <h3 style="text-align: center; color: #ff0000;">ID СКАНЕР</h3>
            <input type="number" id="idInput" placeholder="ВВЕДИТЕ ID ИГРОКА...">
            <button id="checkBtn" class="action-btn" onclick="checkID()">ПРОВЕРИТЬ БАЗУ</button>
            <div id="loader" class="loader"></div>
            <div id="check-res" style="text-align: center; margin-top: 30px; font-weight: bold;"></div>
        </div>

        <div id="vip-screen" class="screen">
            <div id="vip-auth">
                <h3 style="text-align: center; color: #ffd700; margin-bottom: 20px;">АКТИВАЦИЯ</h3>
                <input type="text" id="vipKey" placeholder="ВВЕДИТЕ КЛЮЧ">
                <button class="action-btn" style="background:#ffd700; color:#000;" onclick="tryVip()">ВОЙТИ</button>
            </div>
            <div id="vip-members">
                <div class="status-box">SYSTEM: ACCESS GRANTED</div>
                <h3 style="text-align: center; margin-bottom: 15px;">СОСТАВ</h3>
                <div id="clan-list">
                    <div style="background: rgba(255, 255, 255, 0.03); border-left: 3px solid #ffd700; padding: 12px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; font-size: 0.8rem;">
                        <span>BAW_SAD</span> <span style="color:#ffd700">LEADER</span>
                    </div>
                </div>
                <p onclick="exitVip()" style="text-align:center; color:#333; font-size:0.6rem; text-decoration:underline; margin-top:40px; cursor:pointer;">ВЫЙТИ ИЗ СИСТЕМЫ</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const blackListData = [10303240, 11648545, 11702640, 12294615, 13087170, 13448940, 14208965, 14370070, 14694735, 14815745, 14991700, 15137275, 15208965, 15244365, 15330640, 15575720, 15847470, 16115965, 16319360, 16321645, 16393285, 16725560, 16952270, 17086755, 17399535, 17608000, 17732855, 17761345, 18979230, 19523695, 1993449, 21158260, 21926965, 21962895, 2662588, 3121685, 3371367, 3630468, 3822719, 3836656, 3878276, 3969698, 4002176, 4143088, 4177889, 4218556, 4266638, 4295673, 4378405, 4391082, 4410686, 4583263, 4665274, 4701070, 4704105, 4704781, 4816211, 4902420, 5040096, 5148078, 5206729, 5342294, 5287149, 5588738, 5705174, 5708535, 5752266, 5771145, 5788245, 5829270, 5844182, 5943167, 5947027, 5982489, 5987309, 5991183, 6027602, 6027207, 6030137, 6085692, 6092722, 6116862, 6117188, 6142792, 6155858, 6166546, 6195747, 6220279, 6238684, 6239624, 6273994, 6517659, 6569708, 6614274, 6645546, 6670243, 6706810, 6710212, 6745226, 6794424, 6892904, 6894117, 6917475, 6968280, 7076535, 7079048, 7087225, 7099198, 7186705, 7255114, 7369019, 7421627, 7411344, 7422590, 7474480, 7486355, 7534127, 7563550, 7583887, 7631943, 7728115, 7818211, 7843225, 7910826, 7910926, 7954364, 8085601, 8164037, 8208990, 8278910, 8295931, 8313783, 8325737, 8331639, 8343285, 8364791, 8396294, 8419988, 8535478, 8545833, 8741924, 8888564, 8969060, 8969584, 9003628, 9117736, 9775550, 9802790, 2819306];

        function showScreen(screenId) {
            tg.HapticFeedback.impactOccurred('light');
            const currentScreen = document.querySelector('.screen.active');
            const nextScreen = document.getElementById(screenId);
            const header = document.querySelector('.neon-text');
            const backBtn = document.getElementById('ui-back');

            if (currentScreen) {
                currentScreen.style.opacity = '0';
                currentScreen.style.transform = 'translateY(-10px)';
            }

            setTimeout(() => {
                if (currentScreen) currentScreen.classList.remove('active');
                nextScreen.classList.add('active');
                
                setTimeout(() => {
                    nextScreen.style.opacity = '1';
                    nextScreen.style.transform = 'translateY(0)';
                }, 50);

                if (screenId === 'main-menu') {
                    header.style.opacity = "1";
                    backBtn.classList.add('hidden');
                    tg.BackButton.hide();
                } else {
                    header.style.opacity = "0.3";
                    backBtn.classList.remove('hidden');
                    tg.BackButton.show();
                }
            }, 200);
        }

        tg.BackButton.onClick(() => showScreen('main-menu'));

        function checkID() {
            const val = document.getElementById('idInput').value;
            const res = document.getElementById('check-res');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('checkBtn');

            if(!val) return;
            res.innerHTML = "";
            btn.style.display = "none";
            loader.style.display = "block";
            tg.HapticFeedback.impactOccurred('medium');

            setTimeout(() => {
                loader.style.display = "none";
                btn.style.display = "block";
                if(blackListData.includes(Number(val))) {
                    res.innerHTML = "<span style='color:#ff4444;'>⚠️ В ЧЕРНОМ СПИСКЕ</span>";
                    tg.HapticFeedback.notificationOccurred('error');
                } else {
                    res.innerHTML = "<span style='color:#00ff00;'>✅ ИГРОК ЧИСТ</span>";
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 1000);
        }

        function tryVip() {
            const key = document.getElementById('vipKey').value.trim().toUpperCase();
            if(key === 'ADMIN' || key === 'VIP777') {
                tg.HapticFeedback.notificationOccurred('success');
                
                const vipCard = document.getElementById('vip-card-main');
                vipCard.classList.add('auth-flash');

                localStorage.setItem('clan_auth', 'true');
                
                // Переключаем UI и переименовываем, НО НЕ показываем контент сразу
                toggleVipUI(true, false); 

                setTimeout(() => {
                    showScreen('main-menu');
                    // Показываем содержимое списка только ПОСЛЕ вспышки
                    document.getElementById('vip-members').classList.add('show-content');
                }, 800);

            } else {
                tg.showAlert("ОШИБКА КЛЮЧА");
                tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function toggleVipUI(isVip, showContentImmediate = true) {
            const label = document.getElementById('vip-label');
            const sub = document.getElementById('vip-sub');
            const members = document.getElementById('vip-members');
            
            if(isVip) {
                document.getElementById('vip-auth').classList.add('hidden');
                label.innerText = "ROOM ALL STAR";
                sub.innerText = "MANAGEMENT";
                label.style.color = "#fff";
                label.style.textShadow = "0 0 10px #fff";
                
                if(showContentImmediate) {
                    members.classList.add('show-content');
                }
            } else {
                document.getElementById('vip-auth').classList.remove('hidden');
                members.classList.remove('show-content');
                label.innerText = "VIP";
                sub.innerText = "ДЛЯ КЛАНА";
                label.style.color = "#ffd700";
                label.style.textShadow = "none";
            }
        }

        function exitVip() {
            localStorage.removeItem('clan_auth');
            location.reload();
        }

        function openContact() {
            tg.openTelegramLink("https://t.me/BAW_SAD");
        }

        // При загрузке страницы: если авторизован — показываем контент сразу (БЕЗ анимации)
        if(localStorage.getItem('clan_auth')) {
            toggleVipUI(true, true);
        }
    </script>
</body>
</html>
