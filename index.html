<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALL STAR CLAN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* === CSS СТИЛИ === */
        body { 
            background-color: #080808; 
            color: #ffffff; 
            font-family: 'Orbitron', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            min-height: 100vh; 
            box-sizing: border-box; 
            overflow-x: hidden;
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            position: relative; 
        }

        /* Навигация и кнопка Назад */
        .back-nav { 
            display: flex; 
            align-items: center; 
            margin-bottom: 20px; 
            cursor: pointer; 
            color: #ff0000; 
            font-weight: bold; 
            transition: 0.3s; 
            width: fit-content; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
        }
        .back-nav:active { opacity: 0.5; }
        .back-nav span { font-size: 1.2rem; margin-right: 8px; }

        /* Заголовок */
        header { margin-bottom: 30px; text-align: center; }
        .neon-text { 
            color: #ff0000; 
            font-size: 3rem; 
            text-shadow: 0 0 15px #ff0000; 
            margin: 0; 
        }
        .sub-title { 
            color: #666; 
            letter-spacing: 3px; 
            font-size: 0.8rem; 
            margin-top: 5px; 
        }

        /* Карточки меню */
        .card { 
            background: linear-gradient(145deg, #1a1a1a, #121212); 
            border: 1px solid #333; 
            border-radius: 20px; 
            padding: 25px; 
            margin-top: 20px; 
            cursor: pointer; 
            text-align: center; 
            transition: 0.3s; 
        }
        .card:active { 
            border-color: #ff0000; 
            transform: scale(0.95); 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .icon { font-size: 40px; margin-bottom: 10px; }
        .hidden { display: none !important; }

        /* Анимация появления экранов */
        .screen { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Поля ввода и кнопки */
        input { 
            background: #151515; 
            border: 1px solid #444; 
            padding: 15px; 
            color: white; 
            border-radius: 10px; 
            font-family: 'Orbitron', sans-serif; 
            outline: none; 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
        }
        input:focus { border-color: #ff0000; }

        .action-btn { 
            background: #ff0000; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-family: 'Orbitron', sans-serif; 
            width: 100%; 
        }
        .action-btn:active { background: #b30000; }

        /* Результат проверки */
        #check-result { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            line-height: 1.4; 
            font-size: 0.9rem; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header id="app-header">
            <h1 class="neon-text">ALL STAR</h1>
            <p class="sub-title">OFFICIAL CLAN APP</p>
        </header>

        <div id="back-button-ui" class="back-nav hidden" onclick="showScreen('main-menu')">
            <span>←</span> Назад в меню
        </div>

        <div id="main-menu" class="screen">
            <div class="card" onclick="showScreen('blacklist-screen')">
                <div class="icon">🚫</div>
                <h2>Проверка ЧС</h2>
                <p>Проверить игрока по ID</p>
            </div>
            <div class="card" onclick="handleApplyClick()">
                <div class="icon">📝</div>
                <h2>Подать заявку</h2>
                <p>Набор ограничен</p>
            </div>
        </div>

        <div id="blacklist-screen" class="screen hidden">
            <h2 style="text-align: center; color: #ff0000; margin-bottom: 20px;">ПРОВЕРКА ID</h2>
            <input type="number" placeholder="Введите ID игрока..." id="idInput">
            <button class="action-btn" onclick="checkID()">Проверить базу</button>
            <div id="check-result"></div>
        </div>
    </div>

    <script>
        /* === JS ЛОГИКА === */
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        tg.setHeaderColor('#080808');
        tg.setBackgroundColor('#080808');

        // База данных ID
        const blackListData = [10303240, 11648545, 11702640, 12294615, 13087170, 13448940, 14208965, 14370070, 14694735, 14815745, 14991700, 15137275, 15208965, 15244365, 15330640, 15575720, 15847470, 16115965, 16319360, 16321645, 16393285, 16725560, 16952270, 17086755, 17399535, 17608000, 17732855, 17761345, 18979230, 19523695, 1993449, 21158260, 21926965, 21962895, 2662588, 3121685, 3371367, 3630468, 3822719, 3836656, 3878276, 3969698, 4002176, 4143088, 4177889, 4218556, 4266638, 4295673, 4378405, 4391082, 4410686, 4583263, 4665274, 4701070, 4704105, 4704781, 4816211, 4902420, 5040096, 5148078, 5206729, 5342294, 5287149, 5588738, 5705174, 5708535, 5752266, 5771145, 5788245, 5829270, 5844182, 5943167, 5947027, 5982489, 5987309, 5991183, 6027602, 6027207, 6030137, 6085692, 6092722, 6116862, 6117188, 6142792, 6155858, 6166546, 6195747, 6220279, 6238684, 6239624, 6273994, 6517659, 6569708, 6614274, 6645546, 6670243, 6706810, 6710212, 6745226, 6794424, 6892904, 6894117, 6917475, 6968280, 7076535, 7079048, 7087225, 7099198, 7186705, 7255114, 7369019, 7421627, 7411344, 7422590, 7474480, 7486355, 7534127, 7563550, 7583887, 7631943, 7728115, 7818211, 7843225, 7910826, 7910926, 7954364, 8085601, 8164037, 8208990, 8278910, 8295931, 8313783, 8325737, 8331639, 8343285, 8364791, 8396294, 8419988, 8535478, 8545833, 8741924, 8888564, 8969060, 8969584, 9003628, 9117736, 9775550, 9802790];

        function showScreen(screenId) {
            tg.HapticFeedback.impactOccurred('light');
            
            const mainMenu = document.getElementById('main-menu');
            const blacklistScreen = document.getElementById('blacklist-screen');
            const backBtnUI = document.getElementById('back-button-ui');
            const header = document.getElementById('app-header');

            if (screenId === 'main-menu') {
                mainMenu.classList.remove('hidden');
                header.classList.remove('hidden');
                blacklistScreen.classList.add('hidden');
                backBtnUI.classList.add('hidden');
                tg.BackButton.hide();
            } else {
                mainMenu.classList.add('hidden');
                header.classList.add('hidden');
                blacklistScreen.classList.remove('hidden');
                backBtnUI.classList.remove('hidden');
                tg.BackButton.show();
            }
        }

        tg.BackButton.onClick(() => showScreen('main-menu'));

        function handleApplyClick() {
            tg.HapticFeedback.notificationOccurred('warning');
            tg.showPopup({
                title: 'Набор ограничен',
                message: 'На данный момент автоматический набор закрыт. По всем вопросам вступления пишите Лидеру в личные сообщения.',
                buttons: [
                    {id: 'link', type: 'default', text: 'Написать Лидеру'},
                    {type: 'cancel', text: 'Закрыть'}
                ]
            }, function(buttonId) {
                if (buttonId === 'link') {
                    tg.openTelegramLink("https://t.me/BAW_SAD");
                }
            });
        }

        function checkID() {
            const input = document.getElementById('idInput');
            const resultDiv = document.getElementById('check-result');
            const id = parseInt(input.value.trim());

            if (!id) {
                tg.showAlert("Введите числовой ID!");
                return;
            }

            if (blackListData.includes(id)) {
                tg.HapticFeedback.notificationOccurred('error');
                resultDiv.style.border = "2px solid #ff0000";
                resultDiv.style.color = "#ff4444";
                resultDiv.style.backgroundColor = "rgba(255, 0, 0, 0.1)";
                resultDiv.innerHTML = `⚠️ ВНИМАНИЕ: Игрок в ЧС!<br>Не рекомендуем иметь с ним дел.`;
            } else {
                tg.HapticFeedback.notificationOccurred('success');
                resultDiv.style.border = "1px solid #00ff00";
                resultDiv.style.color = "#00ff00";
                resultDiv.style.backgroundColor = "transparent";
                resultDiv.innerHTML = "✅ ИГРОК ЧИСТ";
            }
        }
    </script>
</body>
</html>
