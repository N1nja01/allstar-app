<script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const blackListData = [10303240, 11648545, 11702640, 12294615, 13087170, 13448940, 14208965, 14370070, 14694735, 14815745, 14991700, 15137275, 15208965, 15244365, 15330640, 15575720, 15847470, 16115965, 16319360, 16321645, 16393285, 16725560, 16952270, 17086755, 17399535, 17608000, 17732855, 17761345, 18979230, 19523695, 1993449, 21158260, 21926965, 21962895, 2662588, 3121685, 3371367, 3630468, 3822719, 3836656, 3878276, 3969698, 4002176, 4143088, 4177889, 4218556, 4266638, 4295673, 4378405, 4391082, 4410686, 4583263, 4665274, 4701070, 4704105, 4704781, 4816211, 4902420, 5040096, 5148078, 5206729, 5342294, 5287149, 5588738, 5705174, 5708535, 5752266, 5771145, 5788245, 5829270, 5844182, 5943167, 5947027, 5982489, 5987309, 5991183, 6027602, 6027207, 6030137, 6085692, 6092722, 6116862, 6117188, 6142792, 6155858, 6166546, 6195747, 6220279, 6238684, 6239624, 6273994, 6517659, 6569708, 6614274, 6645546, 6670243, 6706810, 6710212, 6745226, 6794424, 6892904, 6894117, 6917475, 6968280, 7076535, 7079048, 7087225, 7099198, 7186705, 7255114, 7369019, 7421627, 7411344, 7422590, 7474480, 7486355, 7534127, 7563550, 7583887, 7631943, 7728115, 7818211, 7843225, 7910826, 7910926, 7954364, 8085601, 8164037, 8208990, 8278910, 8295931, 8313783, 8325737, 8331639, 8343285, 8364791, 8396294, 8419988, 8535478, 8545833, 8741924, 8888564, 8969060, 8969584, 9003628, 9117736, 9775550, 9802790, 2819306];

        let currentActiveSub = null;

        // Функция проверки срока действия
        function checkExpiry() {
            const expiry = localStorage.getItem('clan_auth_expiry');
            if (expiry && expiry !== 'never') {
                if (Date.now() > parseInt(expiry)) {
                    exitVip(); // Автоматический выход, если время вышло
                }
            }
        }

        // Запускаем фоновую проверку времени каждую секунду для точности
        setInterval(checkExpiry, 1000);

        function showScreen(screenId) {
            checkExpiry();
            tg.HapticFeedback.impactOccurred('light');
            const current = document.querySelector('.screen.active');
            const next = document.getElementById(screenId);
            const backBtn = document.getElementById('ui-back');

            if (current) {
                current.style.opacity = "0";
                current.style.transform = "translateY(15px)";
            }

            setTimeout(() => {
                if (current) current.classList.remove('active');
                next.classList.add('active');
                setTimeout(() => {
                    next.style.opacity = "1";
                    next.style.transform = "translateY(0)";
                }, 50);

                if (screenId === 'main-menu') {
                    backBtn.classList.add('hidden');
                    tg.BackButton.hide();
                } else {
                    backBtn.classList.remove('hidden');
                    tg.BackButton.show();
                }
            }, 250);
        }

        function goBack() {
            if (currentActiveSub) closeVipSub();
            else showScreen('main-menu');
        }

        tg.BackButton.onClick(goBack);

        function showVipSub(subId) {
            tg.HapticFeedback.impactOccurred('medium');
            const nav = document.getElementById('vip-main-nav');
            const sub = document.getElementById(subId);
            nav.classList.add('hidden');
            sub.classList.remove('hidden');
            setTimeout(() => sub.classList.add('fade-in'), 10);
            currentActiveSub = subId;
        }

        function closeVipSub() {
            if(currentActiveSub) {
                const sub = document.getElementById(currentActiveSub);
                const nav = document.getElementById('vip-main-nav');
                sub.classList.remove('fade-in');
                setTimeout(() => {
                    sub.classList.add('hidden');
                    nav.classList.remove('hidden');
                    currentActiveSub = null;
                }, 300);
            }
        }

        function checkID() {
            const val = document.getElementById('idInput').value;
            const res = document.getElementById('check-res');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('checkBtn');
            if(!val) return;
            res.innerHTML = ""; btn.style.display = "none"; loader.style.display = "block";
            tg.HapticFeedback.impactOccurred('medium');
            setTimeout(() => {
                loader.style.display = "none"; btn.style.display = "block";
                if(blackListData.includes(Number(val))) {
                    res.innerHTML = "<span style='color:#ff4444;'>⚠️ В ЧЕРНОМ СПИСКЕ</span>";
                    tg.HapticFeedback.notificationOccurred('error');
                } else {
                    res.innerHTML = "<span style='color:#00ff00;'>✅ ИГРОК ЧИСТ</span>";
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 800);
        }

        function tryVip() {
            const key = document.getElementById('vipKey').value.trim();
            let expiryTime = null;

            // Логика ключей
            if (key === 'JustN1nja0506') {
                expiryTime = 'never';
            } 
            else if (key === 'AS-9921-XQ') {
                expiryTime = Date.now() + (60 * 60 * 1000); // 1 час
            }
            else if (key === 'TEST-60SEC') {
                expiryTime = Date.now() + (60 * 1000); // 1 минута
            }

            if (expiryTime) {
                tg.HapticFeedback.notificationOccurred('success');
                localStorage.setItem('clan_auth', 'true');
                localStorage.setItem('clan_auth_expiry', expiryTime);
                
                showScreen('main-menu');
                setTimeout(() => {
                    toggleVipUI(true);
                    const vipCard = document.getElementById('vip-card-main');
                    vipCard.classList.add('auth-flash');
                    setTimeout(() => document.getElementById('vip-members').classList.add('ready'), 400);
                }, 300);
            } else {
                tg.showAlert("ОШИБКА: НЕВЕРНЫЙ КЛЮЧ");
            }
        }

        function toggleVipUI(isVip) {
            const label = document.getElementById('vip-label');
            const sub = document.getElementById('vip-sub');
            const members = document.getElementById('vip-members');
            const auth = document.getElementById('vip-auth');
            
            if(isVip) {
                auth.classList.add('hidden');
                members.classList.remove('hidden');
                label.innerText = "ROOM ALL STAR";
                sub.innerText = "VIP";
                label.style.color = "#fff";
                label.style.textShadow = "0 0 10px #fff";
            } else {
                auth.classList.remove('hidden');
                members.classList.add('hidden');
                label.innerText = "VIP";
                sub.innerText = "ДЛЯ КЛАНА";
                label.style.color = "#ffd700";
                label.style.textShadow = "none";
            }
        }

        function exitVip() {
            localStorage.removeItem('clan_auth');
            localStorage.removeItem('clan_auth_expiry');
            location.reload();
        }

        function openContact() {
            tg.openTelegramLink("https://t.me/BAW_SAD");
        }

        // Проверка при загрузке
        checkExpiry();
        if(localStorage.getItem('clan_auth')) {
            toggleVipUI(true);
            document.getElementById('vip-members').classList.add('ready');
        }
    </script>
