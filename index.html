<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALL STAR CLAN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #080808; color: #ffffff; font-family: 'Orbitron', sans-serif; margin: 0; display: flex; justify-content: center; padding: 20px; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 450px; position: relative; }
        .back-nav { display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; color: #ff0000; font-weight: bold; transition: 0.3s; width: fit-content; text-transform: uppercase; font-size: 0.8rem; }
        .back-nav:active { opacity: 0.5; }
        .back-nav span { font-size: 1.2rem; margin-right: 8px; }
        header { margin-bottom: 30px; text-align: center; }
        .neon-text { color: #ff0000; font-size: 2.5rem; text-shadow: 0 0 15px #ff0000; margin: 0; }
        .sub-title { color: #666; letter-spacing: 3px; font-size: 0.7rem; margin-top: 5px; }
        
        /* Карточки меню */
        .card { background: linear-gradient(145deg, #1a1a1a, #121212); border: 1px solid #333; border-radius: 20px; padding: 20px; margin-top: 15px; cursor: pointer; text-align: center; transition: 0.3s; }
        .card:active { border-color: #ff0000; transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .card-vip { border: 1px solid #ffd700; background: linear-gradient(145deg, #1a1a00, #121200); }
        .card-vip h2 { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .icon { font-size: 40px; margin-bottom: 10px; }
        .hidden { display: none !important; }

        input { background: #151515; border: 1px solid #444; padding: 15px; color: white; border-radius: 10px; font-family: 'Orbitron'; outline: none; width: 100%; box-sizing: border-box; margin-bottom: 15px; text-align: center; }
        input:focus { border-color: #ff0000; }
        .action-btn { background: #ff0000; color: white; border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: 'Orbitron'; width: 100%; box-shadow: 0 4px 10px rgba(255,0,0,0.2); }
        
        /* КОМПАКТНЫЙ VIP СТАТУС */
        .vip-card-mini { 
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); 
            padding: 12px; border-radius: 12px; color: #000; text-align: center; margin-top: 10px; box-shadow: 0 5px 15px rgba(255, 215, 0, 0.1);
        }
        .vip-card-mini .label { font-size: 0.5rem; text-transform: uppercase; font-weight: bold; opacity: 0.7; display: block; margin-bottom: 2px; }
        .vip-card-mini .status-val { font-size: 0.85rem; font-weight: bold; }
        
        .vip-only-btn { 
            background: #fff; color: #000; border: none; padding: 18px; margin-top: 20px; border-radius: 15px; width: 100%; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }

        .reset-link { display: block; margin-top: 25px; color: #444; font-size: 0.6rem; text-decoration: underline; cursor: pointer; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

        .members-list { background: rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 40px 20px; margin-top: 20px; border: 1px dashed #333; color: #555; text-align: center; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <header id="app-header">
            <h1 class="neon-text">ALL STAR</h1>
            <p class="sub-title">OFFICIAL CLAN APP</p>
        </header>

        <div id="back-button-ui" class="back-nav hidden" onclick="showScreen('main-menu')">
            <span>←</span> Назад
        </div>

        <div id="main-menu">
            <div class="card" onclick="showScreen('blacklist-screen')">
                <div class="icon">🚫</div>
                <h2>Проверка ЧС</h2>
                <p>База нарушителей</p>
            </div>
            
            <div class="card card-vip" onclick="showScreen('vip-screen')">
                <div class="icon">👑</div>
                <h2 id="menu-vip-title">VIP Вход</h2>
                <p id="menu-vip-subtitle">Доступ по коду</p>
            </div>

            <div class="card" onclick="handleApplyClick()">
                <div class="icon">📝</div>
                <h2>Подать заявку</h2>
                <p>Лидеру в ЛС</p>
            </div>
        </div>

        <div id="blacklist-screen" class="hidden">
            <h2 style="text-align: center; color: #ff0000;">ПРОВЕРКА ID</h2>
            <input type="number" placeholder="Введите ID..." id="idInput">
            <button class="action-btn" onclick="checkID()">Проверить</button>
            <div id="check-result" style="margin-top:15px; text-align:center;"></div>
        </div>

        <div id="vip-screen" class="hidden">
            <div id="vip-form">
                <h2 style="text-align: center; color: #ffd700;">АКТИВАЦИЯ VIP</h2>
                <p style="text-align:center; font-size: 0.7rem; color: #888;">Введите ваш секретный ключ</p>
                <input type="text" placeholder="XXXX-XXXX-XXXX" id="vipCodeInput">
                <button class="action-btn" style="background:#ffd700; color:black;" onclick="checkVipCode()">Активировать</button>
            </div>
            
            <div id="vip-content" class="hidden">
                <h2 style="text-align: center; color: #ffd700; margin-bottom: 10px;">VIP ЗОНА</h2>
                <div class="vip-card-mini">
                    <span class="label">Статус аккаунта</span>
                    <div class="status-val" id="vip-type-title">АКТИВЕН</div>
                </div>
                <button class="vip-only-btn" onclick="showScreen('members-screen')">👥 Участники</button>
                <span class="reset-link" onclick="resetVip()">Сбросить статус (тест)</span>
            </div>
        </div>

        <div id="members-screen" class="hidden">
            <h2 style="text-align: center; color: #ffd700;">УЧАСТНИКИ</h2>
            <div class="members-list">
                <p>СПИСОК ВРЕМЕННО ПУСТ</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const blackListData = [10303240, 11648545, 11702640];

        // ПРОВЕРКА ВРЕМЕНИ ПРИ ЗАГРУЗКЕ
        window.onload = function() {
            checkExpiry();
        };

        function checkExpiry() {
            const savedVip = localStorage.getItem('userVipStatus');
            const expiryTime = localStorage.getItem('vipExpiry');

            if (savedVip && expiryTime) {
                if (Date.now() > parseInt(expiryTime)) {
                    clearVipData();
                } else {
                    applyVipUI(savedVip);
                    updateMainMenuUI(true);
                }
            }
        }

        function clearVipData() {
            localStorage.removeItem('userVipStatus');
            localStorage.removeItem('vipExpiry');
            updateMainMenuUI(false);
            document.getElementById('vip-content').classList.add('hidden');
            document.getElementById('vip-form').classList.remove('hidden');
        }

        function updateMainMenuUI(isVip) {
            if (isVip) {
                document.getElementById('menu-vip-title').innerText = "VIP";
                document.getElementById('menu-vip-subtitle').style.display = "none";
            } else {
                document.getElementById('menu-vip-title').innerText = "VIP Вход";
                document.getElementById('menu-vip-subtitle').style.display = "block";
            }
        }

        function showScreen(screenId) {
            tg.HapticFeedback.impactOccurred('light');
            
            // Перед показом VIP экрана проверяем, не истекло ли время
            if (screenId === 'vip-screen' || screenId === 'main-menu') {
                checkExpiry();
            }

            const screens = ['main-menu', 'blacklist-screen', 'vip-screen', 'members-screen'];
            screens.forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('back-button-ui').classList.remove('hidden');

            if (screenId === 'main-menu') {
                document.getElementById('main-menu').classList.remove('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('back-button-ui').classList.add('hidden');
                tg.BackButton.hide();
            } else {
                document.getElementById(screenId).classList.remove('hidden');
                tg.BackButton.show();
            }
        }

        tg.BackButton.onClick(() => {
            const isMembers = !document.getElementById('members-screen').classList.contains('hidden');
            if (isMembers) showScreen('vip-screen');
            else showScreen('main-menu');
        });

        function handleApplyClick() {
            tg.showPopup({
                title: 'Набор в клан',
                message: 'Свяжитесь с лидером для подачи анкеты.',
                buttons: [{id: 'link', type: 'default', text: 'Написать'}, {type: 'cancel', text: 'Закрыть'}]
            }, (id) => { if(id === 'link') tg.openTelegramLink("https://t.me/BAW_SAD"); });
        }

        function checkID() {
            const id = parseInt(document.getElementById('idInput').value);
            const res = document.getElementById('check-result');
            if (blackListData.includes(id)) {
                res.innerHTML = "<span style='color:#ff4444'>⚠️ В ЧЕРНОМ СПИСКЕ!</span>";
                tg.HapticFeedback.notificationOccurred('error');
            } else if (!id) {
                res.innerHTML = "Введите корректный ID";
            } else {
                res.innerHTML = "<span style='color:#00ff00'>✅ Игрок чист.</span>";
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function applyVipUI(statusText) {
            document.getElementById('vip-type-title').innerText = statusText;
            document.getElementById('vip-content').classList.remove('hidden');
            document.getElementById('vip-form').classList.add('hidden');
        }

        function checkVipCode() {
            const code = document.getElementById('vipCodeInput').value.trim();
            let status = "";
            let duration = 0;

            if (code === "TEST1MIN") {
                status = "ТЕСТ-ДОСТУП: 1 МИНУТА";
                duration = 60 * 1000;
            } else if (code === "VIP1DAY") {
                status = "АКТИВЕН: 1 ДЕНЬ";
                duration = 24 * 60 * 60 * 1000;
            } else if (code === "VIP7DAY") {
                status = "АКТИВЕН: 7 ДНЕЙ";
                duration = 7 * 24 * 60 * 60 * 1000;
            } else if (code === "VIP30DAY") {
                status = "АКТИВЕН: 30 ДНЕЙ";
                duration = 30 * 24 * 60 * 60 * 1000;
            } else if (code === "ULTIMATE") {
                status = "АКТИВЕН: НАВСЕГДА 👑";
                duration = 3650 * 24 * 60 * 60 * 1000;
            }

            if (status !== "") {
                const expiryDate = Date.now() + duration;
                localStorage.setItem('userVipStatus', status);
                localStorage.setItem('vipExpiry', expiryDate.toString());
                
                applyVipUI(status);
                updateMainMenuUI(true);
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                tg.showAlert("Неверный код!");
                tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function resetVip() {
            clearVipData();
            location.reload();
        }
    </script>
</body>
</html>
